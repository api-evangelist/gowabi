aid: gowabi
name: GoWabi
description: >-
  GoWabi is a Bangkok-based beauty and wellness booking marketplace serving
  Thailand and selected markets across Southeast Asia. Consumers use its web and
  mobile apps to discover and book more than 5,000 spas, massage studios, beauty
  clinics, nail, hair, dental, fitness, and wellness providers, with discounted
  deals, cashback rewards, and multiple payment options (credit card, Alipay,
  BNPL). GoWabi also offers a B2B SaaS/CRM tool integrated with partner
  point-of-sale systems to help salons, spas, clinics, and studios manage
  bookings and operations. It is backed by 500 Global. GoWabi operates a private
  mobile app backend (mobile-api.gowabi.com) but publishes no public developer
  API, documentation, or portal at this time.
